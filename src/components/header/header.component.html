<header class="fixed top-0 left-0 right-0 z-50 transition-all duration-300">
  <div class="container mx-auto px-2 sm:px-6 lg:px-8">
    <nav class="relative flex h-20 items-center justify-between gap-3" aria-label="Navegação principal">
      <a routerLink="/" class="flex min-w-0 items-center space-x-2 text-xl font-bold text-futuristic-primary sm:text-2xl"
        aria-label="Studdera - início">
        <img src="/src/assets/images/logo.png" alt="Logo Studdera" class="h-10 w-10 sm:h-12 sm:w-12 object-contain">
        <span class="hidden truncate sm:block">Studdera</span>
      </a>
      <ul class="nav-header absolute left-1/2 hidden -translate-x-1/2 2xl:flex" aria-label="Recursos do Studdera">
        <li><a routerLink="/" routerLinkActive="nav-header__active" [routerLinkActiveOptions]="{ exact: true }">Início</a></li>
        <li><a routerLink="/chat" routerLinkActive="nav-header__active">Chat</a></li>
        <li><a routerLink="/simulados" routerLinkActive="nav-header__active">Simulados</a></li>
        <li><a routerLink="/flashcards" routerLinkActive="nav-header__active">Flashcards</a></li>
        <li><a routerLink="/study-plan" routerLinkActive="nav-header__active">Plano</a></li>
      </ul>
      <div class="flex items-center space-x-2 sm:space-x-4">
        <button (click)="toggleTheme()"
          [title]="themeService.theme() === 'light' ? 'Ativar modo escuro' : 'Ativar modo claro'"
          class="p-2 rounded-full hover:bg-white/20 dark:hover:bg-slate-700/50 transition-colors"
          [aria-label]="themeService.theme() === 'light' ? 'Ativar modo escuro' : 'Ativar modo claro'">
          @if (themeService.theme() === 'light') {
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-futuristic-text dark:text-dark-text" fill="none"
            viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z" />
          </svg>
          } @else {
          <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-futuristic-text dark:text-dark-text" fill="none"
            viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round"
              d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z" />
          </svg>
          }
        </button>

        @if (userService.isLoggedIn()) {
        <div class="flex items-center space-x-2 sm:space-x-4">
          <button (click)="openCreditsModal()"
            class="hidden sm:block text-sm font-medium bg-white/60 dark:bg-slate-700/50 px-3 py-1.5 rounded-full backdrop-blur-sm text-futuristic-subtext dark:text-dark-subtext hover:bg-white/80 dark:hover:bg-slate-700 transition-colors"
            aria-label="Ver créditos">
            Créditos: <span class="font-bold text-futuristic-text dark:text-dark-text">
              {{ userService.credits() | number:'1.0-2' }}
            </span>
          </button>
          <a routerLink="/vestibulares" title="Guia de Vestibulares" aria-label="Guia de Vestibulares"
            class="p-2 rounded-full hover:bg-white/20 dark:hover:bg-slate-700/50 transition-colors">
            <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-futuristic-text dark:text-dark-text"
              viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 3L1 9l11 6 9-4.91V17h2V9L12 3zm0 8.48L5.53 8 12 4.48 18.47 8 12 11.48z" />
            </svg>
          </a>
          <div class="flex items-center space-x-1.5">
            <a routerLink="/profile" class="hover:scale-105 transition-transform duration-300" aria-label="Seu Perfil">
              <div class="h-10 w-10 rounded-full border-2 border-white dark:border-slate-700 overflow-hidden shadow-md">
                <img [src]="userService.getProfilePictureUrl()" class="h-full w-full object-cover"
                  alt="Sua foto de perfil">
              </div>
            </a>
            <!-- Mobile Credits Badge -->
            <button (click)="openCreditsModal()"
              class="sm:hidden px-2.5 py-1 rounded-full bg-futuristic-primary text-white text-[11px] font-bold shadow-md hover:bg-futuristic-secondary transition-colors whitespace-nowrap"
              aria-label="Ver créditos (dispositivo móvel)">
              {{ userService.credits() | number:'1.0-1' }}
            </button>
          </div>
        </div>
        } @else {
        <a routerLink="/login" class="p-2 rounded-full hover:bg-white/20 dark:hover:bg-slate-700/50 transition-colors"
          aria-label="Acessar conta">
          <svg xmlns="http://www.w3.org/2000/svg" class="h-7 w-7 text-futuristic-text dark:text-dark-text"
            viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path
              d="M12 5.9c1.16 0 2.1.94 2.1 2.1s-.94 2.1-2.1 2.1S9.9 9.16 9.9 8s.94-2.1 2.1-2.1m0 9c2.97 0 6.1 1.46 6.1 2.1v1.1H5.9V17c0-.64 3.13-2.1 6.1-2.1M12 4C9.79 4 8 5.79 8 8s1.79 4 4 4 4-1.79 4-4-1.79-4-4-4zm0 9c-2.67 0-8 1.34-8 4v3h16v-3c0-2.66-5.33-4-8-4z" />
          </svg>
        </a>
        }
      </div>
    </nav>
  </div>
  <div class="2xl:hidden border-t border-slate-200/70 bg-white/70 backdrop-blur-md dark:border-slate-700/70 dark:bg-slate-900/85">
    <div class="container mx-auto px-2 overflow-x-auto">
      <ul class="nav-header nav-header--mobile flex" aria-label="Recursos do Studdera">
        <li><a routerLink="/" routerLinkActive="nav-header__active" [routerLinkActiveOptions]="{ exact: true }">Início</a></li>
        <li><a routerLink="/chat" routerLinkActive="nav-header__active">Chat</a></li>
        <li><a routerLink="/simulados" routerLinkActive="nav-header__active">Simulados</a></li>
        <li><a routerLink="/flashcards" routerLinkActive="nav-header__active">Cards</a></li>
        <li><a routerLink="/question-goals" routerLinkActive="nav-header__active">Metas</a></li>
        <li><a routerLink="/vestibulares" routerLinkActive="nav-header__active">Vestibulares</a></li>
        <li><a routerLink="/study-plan" routerLinkActive="nav-header__active">Plano</a></li>
      </ul>
    </div>
  </div>
</header>
<app-header-credits-modal [isOpen]="isCreditsModalOpen()" (close)="closeCreditsModal()"></app-header-credits-modal>
